<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Print Trackers — Pack 369</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .print-controls { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.25rem 1.5rem; margin-bottom: 1.5rem; display: flex; align-items: flex-end; gap: 1rem; flex-wrap: wrap; }

    /* ── PRINT SHEET ── */
    .print-sheet {
      background: white;
      width: 100%;
      max-width: 9in;
      margin: 0 auto 2rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }
    .sheet-header { display: flex; align-items: center; gap: 14px; padding: 14px 18px 10px; border-bottom: 3px solid var(--sheet-color); }
    .sheet-badge { width: 56px; height: 56px; border-radius: 50%; background: var(--sheet-color); display: flex; flex-direction: column; align-items: center; justify-content: center; border: 3px solid var(--gold); flex-shrink: 0; font-size: 22px; }
    .sheet-pack { font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--sheet-color); }
    .sheet-title { font-size: 22px; font-weight: 900; color: var(--ink); font-family: Georgia, serif; }
    .sheet-title em { color: var(--sheet-color); font-style: normal; }
    .sheet-sub { font-size: 10px; color: #666; margin-top: 1px; }
    .sheet-oath { background: var(--sheet-color); color: white; text-align: center; padding: 4px 12px; font-size: 11px; font-weight: 600; letter-spacing: 1px; margin: 0 18px 10px; border-radius: 4px; }
    .sheet-fields { display: grid; grid-template-columns: 2fr 1.2fr 1.2fr 1fr; gap: 10px; padding: 0 18px 10px; }
    .sheet-field { border-bottom: 1.5px solid var(--sheet-color); }
    .sheet-field-label { font-size: 7px; font-weight: 800; color: var(--sheet-color); letter-spacing: 1px; text-transform: uppercase; }
    .sheet-field-line { height: 18px; font-size: 11px; padding-top: 2px; }
    .sheet-tiers { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; padding: 0 18px 10px; }
    .sheet-tier { border-radius: 5px; padding: 6px 10px; display: flex; align-items: center; gap: 8px; border: 2px solid transparent; }
    .st-b { background: #fdf3e3; border-color: #cd7f32; }
    .st-s { background: #f2f4f6; border-color: #9e9e9e; }
    .st-g { background: #fffbe6; border-color: #f4a61d; }
    .st-medal { font-size: 18px; }
    .st-info { flex: 1; }
    .st-name { font-family: Georgia,serif; font-size: 11px; font-weight: 700; }
    .st-b .st-name { color: #7d4e00; } .st-s .st-name { color: #555; } .st-g .st-name { color: #b07a00; }
    .st-sub { font-size: 7.5px; font-weight: 700; color: #888; }
    .st-reward { font-size: 7.5px; color: #333; font-weight: 600; margin-top: 1px; }
    .st-days { font-family: Georgia,serif; font-size: 17px; font-weight: 900; text-align: center; }
    .st-b .st-days { color: #cd7f32; } .st-s .st-days { color: #9e9e9e; } .st-g .st-days { color: #f4a61d; }
    .st-dlbl { font-size: 7px; font-weight: 800; color: #888; text-align: center; }
    .sheet-honor { margin: 0 18px 10px; background: var(--sheet-honor-bg); border: 1.5px solid var(--sheet-honor-border); border-left: 4px solid var(--sheet-color); border-radius: 4px; padding: 5px 10px; display: flex; gap: 8px; }
    .sh-icon { font-size: 12px; flex-shrink: 0; }
    .sh-title { font-size: 8px; font-weight: 900; color: var(--sheet-color); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 1px; }
    .sh-body { font-size: 7.5px; color: #333; font-weight: 600; line-height: 1.5; }
    .sheet-menu { margin: 0 18px 10px; background: var(--sheet-menu-bg); border: 1.5px solid var(--sheet-menu-border); border-radius: 5px; padding: 6px 10px; }
    .sm-title { font-size: 9px; font-weight: 900; color: var(--sheet-color); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
    .sm-grid { display: grid; gap: 5px; }
    .sm-cat-title { font-size: 7.5px; font-weight: 900; color: var(--sheet-color); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 1px; }
    .sm-cat-items { font-size: 7px; color: #444; line-height: 1.5; font-weight: 600; }
    .sheet-grid { padding: 0 18px 10px; }
    .sg-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
    .sg-title { font-family: Georgia,serif; font-size: 12px; font-weight: 700; }
    .sg-hint { font-size: 7px; color: #888; font-weight: 700; }
    .sm-block { margin-bottom: 5px; }
    .sm-label { font-size: 8px; font-weight: 700; color: white; background: var(--sheet-color); display: inline-block; padding: 1px 7px; border-radius: 2px 2px 0 0; letter-spacing: 1px; text-transform: uppercase; }
    .sm-row { display: grid; gap: 2px; background: var(--sheet-grid-bg); padding: 3px; border-radius: 0 4px 4px 4px; }
    .sd-box { height: 20px; border: 1.5px solid var(--sheet-day-border); border-radius: 2px; background: white; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 1px; font-size: 6px; font-weight: 800; color: #aaa; }
    .sd-box.sd-logged { background: var(--sheet-color); color: white; border-color: var(--sheet-color); font-size: 5.5px; }
    .sd-m30 { border-color: #cd7f32 !important; border-width: 2px !important; }
    .sd-m60 { border-color: #9e9e9e !important; border-width: 2px !important; }
    .sd-m90 { border-color: #f4a61d !important; border-width: 2.5px !important; }
    .sd-flag { position: absolute; top: -7px; right: -1px; font-size: 7px; line-height: 1; }
    .sheet-sigs { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; padding: 0 18px 10px; }
    .ss-field { border-bottom: 1.5px solid #333; padding-bottom: 2px; }
    .ss-label { font-size: 7px; font-weight: 800; color: #555; letter-spacing: 1px; text-transform: uppercase; }
    .ss-line { height: 18px; }
    .sheet-footer { display: flex; align-items: center; justify-content: space-between; border-top: 2px solid var(--sheet-color); padding: 5px 18px 12px; font-size: 7px; color: #888; font-weight: 700; }
    .sf-center { font-family: Georgia,serif; font-size: 9px; font-weight: 600; color: var(--sheet-color); letter-spacing: 1px; }

    @media print {
      .print-controls, .topbar, .hero, .no-print { display: none !important; }
      .print-sheet { box-shadow: none; page-break-after: always; max-width: 100%; border-radius: 0; margin: 0; }
      body { background: white; }
    }
  </style>
</head>
<body>

<nav class="topbar no-print">
  <a class="topbar-brand" href="javascript:history.back()"><img src="images/cub-scouts-logo.jpg" alt="" class="topbar-cs-logo"> <span>Pack 369</span></a>
  <div class="topbar-nav">
    <button class="btn btn-ghost btn-sm" onclick="signOut()" style="color:rgba(255,255,255,0.75); border-color:rgba(255,255,255,0.3);">Sign Out</button>
  </div>
</nav>

<div class="hero no-print" style="background: linear-gradient(135deg, #2d3561, var(--ink));">
  <img src="images/pack-logo.png" alt="" class="hero-watermark" aria-hidden="true">
  <div class="hero-inner">
    <div class="hero-label">Pack 369 · Print View</div>
    <h1>Print Trackers</h1>
    <p>Generate print-ready sheets with logged days pre-filled.</p>
  </div>
</div>

<div class="container no-print" style="margin-top: 2rem;">
  <div class="print-controls">
    <div id="scout-selector-wrap" style="display:none;">
      <label>Scout</label>
      <select id="scout-select" onchange="render()" style="min-width:200px;"></select>
    </div>
    <div>
      <label>Phase</label>
      <select id="phase-select" onchange="render()">
        <option value="all">All Three Phases</option>
        <option value="physically-strong">Physically Strong</option>
        <option value="mentally-awake">Mentally Awake</option>
        <option value="morally-straight">Morally Straight</option>
      </select>
    </div>
    <button class="btn btn-primary" onclick="window.print()">🖨 Print / Save PDF</button>
  </div>
</div>

<div id="sheets-area" style="padding: 0 1.5rem;"></div>

<script src="js/app.js"></script>
<script>
  SESSION.requireAuth();

  const isLeader = SESSION.isLeader();
  const myScoutId = SESSION.scoutId();

  let scouts  = [];
  let allLogs = [];

  async function init() {
    try {
      if (isLeader) {
        scouts  = await sb.select('scouts', 'select=id,name,den,rank,parent&order=name');
        allLogs = await sb.select('logs',   'select=scout_id,phase,day_num,category');
        const sel = document.getElementById('scout-select');
        sel.innerHTML = scouts.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
        const urlScout = new URLSearchParams(location.search).get('scout');
        if (urlScout) sel.value = urlScout;
        document.getElementById('scout-selector-wrap').style.display = 'block';
      } else {
        const res = await sb.select('scouts', `id=eq.${myScoutId}&select=id,name,den,rank,parent`);
        scouts = res;
        const logs = await sb.select('logs', `scout_id=eq.${myScoutId}&select=scout_id,phase,day_num,category`);
        allLogs = logs;
      }
      render();
    } catch(err) {
      document.getElementById('sheets-area').innerHTML = `<div class="alert alert-warn">Error loading data: ${err.message}</div>`;
    }
  }

  function render() {
    const scoutId  = isLeader ? document.getElementById('scout-select').value : myScoutId;
    const phaseVal = document.getElementById('phase-select').value;
    const scout    = scouts.find(s => s.id === scoutId);
    if (!scout) return;

    const phaseIds = phaseVal === 'all' ? Object.keys(APP.phases) : [phaseVal];
    const scoutLogs = allLogs.filter(l => l.scout_id === scoutId);

    document.getElementById('sheets-area').innerHTML = phaseIds.map(pid => buildSheet(scout, pid, scoutLogs)).join('');
  }

  const THEME = {
    'physically-strong': { color:'#1a6b3c', hBg:'#eef8f2', hBdr:'#a8d9bc', mBg:'#f8fdf9', mBdr:'#c8e6d4', gBg:'#e8f4ee', dBdr:'#b5d9c5', hint:'S · E · B · NH', note:' Numbers are goals — younger Scouts, do your best!' },
    'mentally-awake':    { color:'#1a3f6b', hBg:'#eef4fb', hBdr:'#a8c8e8', mBg:'#f4f8fd', mBdr:'#b8d4ec', gBg:'#dce8f5', dBdr:'#a8c4e0', hint:'W · L · A · C · NH', note:'' },
    'morally-straight':  { color:'#6b1a1a', hBg:'#fdf0f0', hBdr:'#e8b4b4', mBg:'#fdf5f5', mBdr:'#e8c4c4', gBg:'#f5e0e0', dBdr:'#dda8a8', hint:'G · C · S · Ch · NH', note:'' },
  };

  function buildSheet(scout, phaseId, scoutLogs) {
    const phase = APP.phases[phaseId];
    const t     = THEME[phaseId];
    const logs  = {};
    scoutLogs.filter(l => l.phase === phaseId).forEach(l => { logs[l.day_num] = l.category; });

    let dayNum = 1;
    const monthGrids = phase.months.map((month, mi) => {
      const days = phase.monthDays[mi];
      let cells  = '';
      for (let d = 0; d < days; d++) {
        const dn  = dayNum++;
        const cat = logs[dn];
        const m   = dn === 30 ? 'sd-m30' : dn === 60 ? 'sd-m60' : dn === 90 ? 'sd-m90' : '';
        const flag= dn === 30 ? '🥉' : dn === 60 ? '🥈' : dn === 90 ? '🥇' : '';
        cells += `<div class="sd-box ${cat ? 'sd-logged' : ''} ${m}">${flag ? `<div class="sd-flag">${flag}</div>` : ''}${cat || dn}</div>`;
      }
      return `<div class="sm-block"><div class="sm-label">${month}</div><div class="sm-row" style="grid-template-columns:repeat(${days},1fr);">${cells}</div></div>`;
    }).join('');

    return `<div class="print-sheet" style="
      --sheet-color:${t.color}; --sheet-honor-bg:${t.hBg}; --sheet-honor-border:${t.hBdr};
      --sheet-menu-bg:${t.mBg}; --sheet-menu-border:${t.mBdr}; --sheet-grid-bg:${t.gBg}; --sheet-day-border:${t.dBdr};">
      <div class="sheet-header">
        <div class="sheet-badge">${phase.emoji}</div>
        <div>
          <div class="sheet-pack">Pack 369 · New Hampshire · Cub Scouts</div>
          <div class="sheet-title">90-Day <em>${phase.label}</em> Challenge</div>
          <div class="sheet-sub">${phase.period} &nbsp;|&nbsp; One activity per day, parent-initialed &nbsp;|&nbsp; Turn in at ${phase.months[2]} Pack Meeting</div>
        </div>
      </div>
      <div class="sheet-oath">"On my honor I will do my best to keep myself… ${phase.label.toUpperCase()}" — The Scout Oath</div>
      <div class="sheet-fields">
        <div class="sheet-field"><div class="sheet-field-label">Scout's Name</div><div class="sheet-field-line">${scout.name}</div></div>
        <div class="sheet-field"><div class="sheet-field-label">Den / Rank</div><div class="sheet-field-line">${scout.den}</div></div>
        <div class="sheet-field"><div class="sheet-field-label">Parent / Guardian</div><div class="sheet-field-line">${scout.parent || ''}</div></div>
        <div class="sheet-field"><div class="sheet-field-label">Start Date</div><div class="sheet-field-line"></div></div>
      </div>
      <div class="sheet-tiers">
        ${phase.tiers.map((tr,i) => `<div class="sheet-tier ${['st-b','st-s','st-g'][i]}">
          <div class="st-medal">${tr.emoji}</div>
          <div class="st-info"><div class="st-name">${tr.name}</div><div class="st-sub">${tr.level} Level</div><div class="st-reward">${tr.reward}</div></div>
          <div><div class="st-days">${tr.days}</div><div class="st-dlbl">DAYS</div></div>
        </div>`).join('')}
      </div>
      <div class="sheet-honor">
        <div class="sh-icon">🤝</div>
        <div><div class="sh-title">Scout's Honor Weekly Rule</div>
        <div class="sh-body">Each week, complete at least one activity from every category. A Scout is trustworthy: your parent's initials are your pledge.${t.note}</div></div>
      </div>
      <div class="sheet-menu">
        <div class="sm-title">📋 Daily Activity Menu — Pick One Per Day (one from each category per week)</div>
        <div class="sm-grid" style="grid-template-columns:repeat(${phase.categories.length},1fr);">
          ${phase.categories.map(c => `<div><div class="sm-cat-title">${c.emoji} ${c.label}</div><div class="sm-cat-items">${c.items.join('<br>')}</div></div>`).join('')}
        </div>
      </div>
      <div class="sheet-grid">
        <div class="sg-header"><div class="sg-title">Activity Log — 90 Days</div><div class="sg-hint">Write category initial (${t.hint}) · Parent initials below · 🥉=Day 30 · 🥈=Day 60 · 🥇=Day 90</div></div>
        ${monthGrids}
      </div>
      <div class="sheet-sigs">
        <div class="ss-field"><div class="ss-label">Scout Signature</div><div class="ss-line"></div></div>
        <div class="ss-field"><div class="ss-label">Parent / Guardian Signature</div><div class="ss-line"></div></div>
        <div class="ss-field"><div class="ss-label">Den Leader Signature</div><div class="ss-line"></div></div>
      </div>
      <div class="sheet-footer">
        <div>Pack 369 · New Hampshire<br>${phase.label} Phase · ${phase.period}</div>
        <div class="sf-center">Be Prepared &nbsp;·&nbsp; Do Your Best</div>
        <div style="text-align:right;">Turn in at ${phase.months[2]}<br>Pack Meeting for Award</div>
      </div>
    </div>`;
  }

  function signOut() { SESSION.clear(); location.href = 'index.html'; }

  init();
</script>
</body>
</html>
